    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <title>Talha Ismail — 2D Animator & Motion Designer</title>
    <meta name="description" content="Talha Ismail is a 2D animator and motion designer creating character animation, logo motion, kinetic typography, explainer videos and visual storytelling." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Talha Ismail — 2D Animator & Motion Designer" />
    <meta property="og:description" content="Commercial 2D animator, motion designer, and visual storyteller crafting character rigs, kinetic typography, and broadcast-ready brand animation." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop" />
    
    <!-- Google Fonts: Space Grotesk, DM Sans, Syne -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

    <!-- Zero-flash theme initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('talha_theme_pref');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg-primary text-paper antialiased selection:bg-accent selection:text-bg-primary overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
